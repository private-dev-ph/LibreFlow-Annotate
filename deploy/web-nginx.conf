server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    types { application/javascript js mjs; text/html html; text/css css; image/svg+xml svg; application/manifest+json json; }
    access_log off;
    client_max_body_size 1k;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' blob: data:; connect-src https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com https://graph.microsoft.com https://*.1drv.com https://*.sharepoint.com https://api.dropboxapi.com https://content.dropboxapi.com https://login.microsoftonline.com https://api.dropbox.com http://127.0.0.1:8787; worker-src 'self'; manifest-src 'self'; base-uri 'none'; frame-src https://accounts.google.com; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ~ ^/(api|uploads|models-static|datasets-files|data|versions)(/|$) { return 404; }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
}
