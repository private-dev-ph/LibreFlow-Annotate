site_name: LibreFlow Annotate
site_description: Local-first image annotation, review, dataset lifecycle, and automation workspace for computer vision teams.
site_url: https://github.com/your-org/LibreFlow-Annotate
repo_name: LibreFlow-Annotate
repo_url: https://github.com/your-org/LibreFlow-Annotate
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Getting started:
      - Setup: setup.md
      - Using LibreFlow: usage.md
  - Product:
      - Architecture: architecture.md
      - Review and quality: review-and-quality.md
      - Dataset lifecycle: dataset-lifecycle.md
      - Automation and integrations: automation-api.md
  - Reference:
      - API reference: api-reference.md
      - Technical notes: documentation.md
