# Optional local MCP bridge. Add this after your existing Compose configuration
# and retain the same --project-directory so existing data bind mounts stay put.
services:
  app:
    environment:
      LIBREFLOW_MCP_ENABLED: "true"
      LIBREFLOW_MCP_HOST: "0.0.0.0"
      LIBREFLOW_MCP_PORT: "6769"
    ports:
      - "127.0.0.1:6769:6769"
