services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreflow-annotate-app:local
    ports:
      - "127.0.0.1:${PORT:-6767}:6767"
    environment:
      PORT: "6767"
      NODE_ENV: "${NODE_ENV:-development}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      AUTOMATION_SECRET_KEY: "${AUTOMATION_SECRET_KEY:-}"
      AUTOMATION_SECRET_KEY_ID: "${AUTOMATION_SECRET_KEY_ID:-}"
      AUTOMATION_SECRET_KEYS: "${AUTOMATION_SECRET_KEYS:-}"
      AUTOMATION_LEGACY_KEY: "${AUTOMATION_LEGACY_KEY:-}"
      SESSION_STORE_DIR: "/app/data/sessions"
      APP_ORIGINS: "${APP_ORIGINS:-}"
      COOKIE_SAME_SITE: "${COOKIE_SAME_SITE:-lax}"
      TRUST_PROXY: "${TRUST_PROXY:-loopback}"
      INFER_SERVER_URL: "http://inference:7878"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./versions:/app/versions
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6767/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-libreflow}"
      POSTGRES_USER: "${POSTGRES_USER:-libreflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-libreflow-dev-password}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - libreflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: Dockerfile.infer
    image: libreflow-annotate-inference:local
    environment:
      YOLO_CONFIG_DIR: "/tmp/ultralytics"
    # The path-based trusted inference API is accessible only inside Compose.
    expose:
      - "7878"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./datasets:/app/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  libreflow-postgres-data:
